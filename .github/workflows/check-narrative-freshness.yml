name: Check Narrative Freshness

# Automatický test konzistence mezi textem narrativu a živým skóre (viz
# scripts/check-narrative-freshness.mjs). Žádné volání OpenAI, jen čtení z DB — bezpečné
# spouštět hodinově jako lehký health-check, ne jen ručně.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '25 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Neshoda textu se skóre je informace pro správce (napíše nový text), ne selhání běhu — aby
      # nechodily e-maily "Run failed". Zobrazí se jako varování v Actions.
      - run: node scripts/check-narrative-freshness.mjs || echo "::warning::Některý text příběhu neodpovídá aktuálnímu skóre — správce má napsat nový."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
