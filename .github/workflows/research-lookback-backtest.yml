name: Research - Lookback Backtest

# Jednorázový výzkum (jen workflow_dispatch). Čte kalendář a ceny, stáhne starší týdny
# ForexFactory přes relay a drží je jen v cache — NIKDY nezapisuje do produkčních tabulek
# a nevolá recomputeScores().
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: research-lookback-backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: research-cache
          key: ff-calendar-research-v1-${{ github.run_id }}
          restore-keys: ff-calendar-research-v1-
      - run: node scripts/research-lookback-backtest.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
