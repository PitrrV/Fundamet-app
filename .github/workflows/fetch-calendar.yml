name: Fetch ForexFactory Calendar

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_narrative:
        description: "Vynutit přegenerování shrnutí i bez nově zachyceného 'actual' (ruční editace v appce)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # potřeba, aby skript mohl přes GitHub API rovnou spustit generate-narrative.yml

# Souběžné běhy fronta, ne zabít/přeskočit — dřívější absence tohohle byla pravděpodobná
# příčina minutého spouštěče přegenerování narrativu (viz komentář u thesisSignal ve
# fetch-calendar.mjs): dva běhy blízko sebe (pravidelný cron + ruční dispatch) mohly každý
# vidět "actual" už vyplněný tím druhým, takže scrape-diff spouštěč tiše nezafiroval.
concurrency:
  group: fetch-calendar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/fetch-calendar.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # U cronu je inputs.force_narrative prázdné -> vyhodnotí se jako false, chování beze změny.
          FORCE_NARRATIVE_REGEN: ${{ inputs.force_narrative }}
