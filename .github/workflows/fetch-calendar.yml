name: Fetch ForexFactory Calendar

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_narrative:
        description: "Vynutit přegenerování shrnutí i bez nově zachyceného 'actual' (ruční editace v appce)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # potřeba, aby skript mohl přes GitHub API rovnou spustit generate-narrative.yml

# Souběžné běhy fronta, ne zabít/přeskočit — dřívější absence tohohle byla pravděpodobná
# příčina minutého spouštěče přegenerování narrativu (viz komentář u thesisSignal ve
# fetch-calendar.mjs): dva běhy blízko sebe (pravidelný cron + ruční dispatch) mohly každý
# vidět "actual" už vyplněný tím druhým, takže scrape-diff spouštěč tiše nezafiroval.
concurrency:
  group: fetch-calendar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/fetch-calendar.mjs
        # Pojistka proti zaseknutému fetchi (relay/ForexFactory) — scripts/fetch-calendar.mjs
        # má vlastní per-request timeout (FETCH_TIMEOUT_MS), tohle je druhá, hrubší vrstva pro
        # cokoli nepředvídaného (stejná konvence jako Fx-Analyzer .github/workflows/data-refresh.yml).
        # S concurrency.cancel-in-progress:false výš by se jinak zaseknutý běh mohl frontou
        # táhnout donekonečna a blokovat všechny další 15minutové běhy za sebou.
        timeout-minutes: 8
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # U cronu je inputs.force_narrative prázdné -> vyhodnotí se jako false, chování beze změny.
          FORCE_NARRATIVE_REGEN: ${{ inputs.force_narrative }}
          # Nepovinné — bez nich sendTelegramAlert() jen tiše nic neposílá (viz fetch-calendar.mjs).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
