name: Debug new data sources
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test FRED + stooq
        run: |
          node -e "
          const urls = [
            ['FRED DGS2 (US 2Y)', 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2'],
            ['FRED VIXCLS', 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS'],
            ['stooq VIX', 'https://stooq.com/q/d/l/?s=^vix&i=d'],
            ['stooq VIX alt (no caret enc)', 'https://stooq.com/q/d/l/?s=vix.us&i=d'],
          ];
          (async () => {
            for (const [label, url] of urls) {
              try {
                const res = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
                const text = await res.text();
                console.log(label, '->', url, '-> HTTP', res.status, 'len=' + text.length);
                console.log(text.split('\n').slice(0,3).join(' | '));
                console.log(text.split('\n').slice(-3).join(' | '));
                console.log('---');
              } catch (e) {
                console.log(label, '-> ERROR', e.message);
              }
            }
          })();
          "
