name: Debug FF mirror 2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect faireconomy JSON shape
        run: |
          node -e "
          (async () => {
            const res = await fetch('https://nfs.faireconomy.media/ff_calendar_thisweek.json');
            const events = await res.json();
            console.log('total events:', events.length);
            const impacts = new Set(events.map(e => e.impact));
            console.log('impact values:', [...impacts]);
            const currencies = new Set(events.map(e => e.country));
            console.log('currencies:', [...currencies]);
            const now = Date.now();
            const past = events.filter(e => new Date(e.date).getTime() < now);
            console.log('past events count:', past.length);
            console.log('sample past event (raw):', JSON.stringify(past[0]));
            console.log('sample past event with actual?:', JSON.stringify(past.find(e => e.actual)));
            const future = events.filter(e => new Date(e.date).getTime() >= now);
            console.log('sample future event:', JSON.stringify(future[0]));
            console.log('first date:', events[0]?.date, 'last date:', events[events.length-1]?.date);
            console.log('all keys seen:', [...new Set(events.flatMap(e => Object.keys(e)))]);
          })();
          "
