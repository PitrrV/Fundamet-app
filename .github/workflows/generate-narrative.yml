name: Generate Fundamental Narrative

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Vynutit přegenerování všech měn i beze změny vstupů"
        type: boolean
        default: false
      only_currencies:
        description: "Omezit na tyhle měny (čárkou oddělené kódy, např. NZD,GBP) — prázdné = všechny. Používá ho hlavně automatický trigger z fetch-calendar.mjs, aby se nákladné LLM/TTS volání netočilo pro měny, co se vůbec nezměnily."
        type: string
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/generate-narrative.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          # Jednorázové vynucení z ručního spuštění (u cronu je prázdné → vyhodnotí se jako false).
          FORCE_REGENERATE: ${{ inputs.force }}
          # Nouzový vypínač detekce změn. Nastav repo variable DISABLE_INPUT_HASH=1
          # (Settings → Variables) a appka se okamžitě vrátí k původnímu "generuj vždy
          # všechno" — bez revertu kódu a bez nasazování.
          DISABLE_INPUT_HASH: ${{ vars.DISABLE_INPUT_HASH }}
          ONLY_CURRENCIES: ${{ inputs.only_currencies }}
      # Automatický test konzistence: ověří, že skóre uložené v narrativu odpovídá živému
      # skóre. continue-on-error, protože runtime pojistka v generate-narrative.mjs už jednou
      # přegenerovala při zjištěné neshodě — pokud se skóre posune AŽ MEZI dokončením tohodle
      # jobu a tímhle krokem (další samostatný cron fetch-calendar.yml), nejde o chybu tohodle
      # běhu; krok to i tak viditelně zaloguje do Actions, jen nesrazí celý job do červena.
      - run: node scripts/check-narrative-freshness.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
